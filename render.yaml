services:
  - type: web
    name: cravebite-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cravebite-db
          property: connectionString

databases:
  - name: cravebite-db
    plan: free
    databaseName: cravebite
    user: cravebite_user
